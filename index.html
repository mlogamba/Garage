<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parking · Pagos</title>
<meta name="theme-color" content="#20272b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parking">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--asfalto:#20272b;--linea:#ffc933;--fondo:#e9ecee;--tinta:#1d2327;--suave:#5d6a72;--ok:#1f7a4d;--mal:#b3261e;--borde:#cfd5d9}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.4 Barlow,system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{background:var(--asfalto);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 20px 24px;border-bottom:6px dashed var(--linea)}
.wrap{max-width:640px;margin:0 auto}
h1{font:700 34px/1 'Barlow Condensed',sans-serif;margin:0 0 18px;letter-spacing:.5px}
.resumen{display:flex;gap:28px;flex-wrap:wrap}
.resumen b{display:block;font:700 28px/1.1 'Barlow Condensed',sans-serif}
.resumen span{color:#aeb9bf;font-size:14px}
.chip{display:inline-block;margin-top:16px;padding:4px 12px;border-radius:99px;font-weight:600;font-size:14px}
.chip.ok{background:#d8f1e3;color:var(--ok)}.chip.mal{background:#fde0dd;color:var(--mal)}
main{padding:16px 20px 90px}
h2{font:700 22px/1 'Barlow Condensed',sans-serif;margin:26px 0 6px;color:var(--suave)}
.fila{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--borde);padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
.fila:first-of-type{border-radius:8px 8px 0 0}.fila:last-of-type{border-radius:0 0 8px 8px;border-bottom:0}
.fila:hover{background:#fbfbf3}
.fila small{display:block;color:var(--suave)}
.fila .der{text-align:right;white-space:nowrap}.fila .der b{font-weight:600}
.nota{font-style:italic}
.vacio{color:var(--suave);padding:30px 0;text-align:center}
.barra{position:fixed;left:0;right:0;bottom:0;background:var(--fondo);border-top:1px solid var(--borde);padding:10px 20px calc(10px + env(safe-area-inset-bottom))}
.barra .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}
#estado{font-size:13px;color:var(--suave)}#estado.err{color:var(--mal)}
button.p{background:var(--linea);color:var(--tinta);border:0;border-radius:8px;padding:11px 18px;font:600 16px Barlow,sans-serif;cursor:pointer}
button.s{background:none;border:1px solid var(--borde);border-radius:8px;padding:10px 16px;font:500 16px Barlow,sans-serif;cursor:pointer;color:var(--tinta)}
button.peligro{color:var(--mal);border-color:var(--mal)}
button:focus-visible,input:focus-visible{outline:3px solid var(--asfalto);outline-offset:2px}
dialog{border:0;border-radius:12px;padding:22px;width:min(420px,calc(100% - 32px));box-shadow:0 10px 40px #0004}
dialog::backdrop{background:#20272bb0}
dialog h3{font:700 24px/1 'Barlow Condensed',sans-serif;margin:0 0 14px}
label{display:block;font-weight:500;font-size:14px;margin:12px 0 4px}
input{width:100%;padding:10px;border:1px solid var(--borde);border-radius:8px;font:inherit}
.acciones{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.msg{min-height:20px;margin-top:10px;font-size:14px;color:var(--suave)}.msg.err{color:var(--mal)}
.aviso-dlg{padding:0;overflow:hidden;width:min(400px,calc(100% - 32px));border-radius:18px}
.aviso-dlg[open]{animation:av-in .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes av-in{from{transform:translateY(24px) scale(.9);opacity:0}}
.av-cab{position:relative;color:#fff;text-align:center;padding:30px 20px 24px}
.av-cab.mal{background:linear-gradient(160deg,#e0382c,#8f1a12)}
.av-cab.ok{background:linear-gradient(160deg,#2fb36d,#14623b)}
.av-cab svg{display:block;margin:0 auto 10px}
.av-cab.mal svg{animation:av-pulso 1.1s ease-in-out infinite}
@keyframes av-pulso{50%{transform:scale(1.12)}}
.av-cab .chk{stroke-dasharray:60;stroke-dashoffset:60;animation:av-chk .6s .25s ease-out forwards}
@keyframes av-chk{to{stroke-dashoffset:0}}
.av-mes{font:700 46px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:1px}
.av-sub{font:600 18px/1.2 Barlow,sans-serif;margin-top:8px;text-transform:uppercase;letter-spacing:2px}
.av-conf{position:absolute;top:-14px;width:8px;height:14px;opacity:0;animation:av-cae 1.9s ease-out forwards}
@keyframes av-cae{10%{opacity:1}to{transform:translateY(260px) rotate(540deg);opacity:0}}
.av-cuerpo{padding:20px 22px 22px}
.av-txt{margin:0 0 12px;font-weight:500}
.av-extra{margin:0 0 12px;padding:8px 12px;border-radius:8px;background:#d8f1e3;color:var(--ok);font-weight:600;font-size:14px}
.av-extra.prueba{background:#fff3cd;color:#7a5b00}
.av-btn{width:100%;border:0;border-radius:10px;padding:14px;font:700 17px Barlow,sans-serif;cursor:pointer;color:#fff;margin-top:8px}
.av-btn.mal{background:#c5221a}.av-btn.ok{background:#1f7a4d}.av-btn:disabled{opacity:.6}
.av-links{display:flex;justify-content:space-between;margin-top:12px}
.av-links button{background:none;border:0;color:var(--suave);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.aviso-dlg[open],.av-cab svg,.av-conf{animation:none!important}.av-cab .chk{animation:none;stroke-dashoffset:0}}
footer{text-align:center;margin-top:30px}footer button{background:none;border:0;color:var(--suave);text-decoration:underline;cursor:pointer;font:inherit;font-size:14px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Parking · Alquiler</h1>
  <div class="resumen">
    <div><b class="num" id="total">–</b><span>total pagado</span></div>
    <div><b class="num" id="cuenta">–</b><span>pagos registrados</span></div>
    <div><b class="num" id="ultimo">–</b><span>último pago</span></div>
  </div>
  <div class="chip" id="chip" hidden></div>
</div></header>

<main><div class="wrap">
  <div id="lista"></div>
  <footer>
    <p id="instalar" hidden><button class="p" id="btnInstalar">Instalar la app</button></p>
    <p id="ayudaIos" class="vacio" hidden>Para instalarla: pulsa <b>Compartir</b> y luego <b>Añadir a pantalla de inicio</b>.</p>
    <button id="btnClave">Cambiar contraseña</button>
  </footer>
</div></main>

<div class="barra"><div class="wrap">
  <span id="estado">Cargando…</span>
  <button class="p" id="btnNuevo">+ Registrar pago</button>
</div></div>

<dialog id="dlg"><form id="frm" autocomplete="off">
  <h3 id="dlgTitulo">Registrar pago</h3>
  <label for="mes">Mes que se paga</label><input id="mes" type="month" required>
  <label for="fecha">Fecha del pago</label><input id="fecha" type="date" required>
  <label for="importe">Importe (€)</label><input id="importe" type="number" min="0.01" step="0.01" required>
  <label for="nota">Nota (opcional)</label><input id="nota" type="text" maxlength="500">
  <label for="clave">Contraseña</label><input id="clave" type="password" inputmode="numeric" required>
  <div class="msg" id="msg"></div>
  <div class="acciones">
    <button type="button" class="s peligro" id="btnEliminar" hidden>Eliminar</button>
    <button type="button" class="s" id="btnCancelar">Cancelar</button>
    <button type="submit" class="p">Guardar</button>
  </div>
</form></dialog>

<dialog id="dlgClave"><form id="frmClave" autocomplete="off">
  <h3>Cambiar contraseña</h3>
  <label for="claveActual">Contraseña actual</label><input id="claveActual" type="password" required>
  <label for="claveNueva">Contraseña nueva</label><input id="claveNueva" type="password" minlength="4" required>
  <div class="msg" id="msgClave"></div>
  <div class="acciones">
    <button type="button" class="s" id="cancelarClave">Cancelar</button>
    <button type="submit" class="p">Cambiar</button>
  </div>
</form></dialog>

<dialog id="dlgAviso" class="aviso-dlg"></dialog>

<script>
// 1) Pega aquí la URL de tu aplicación web de Apps Script (termina en /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbx9arRw4RHtfTe-igPaIn9isV18JuSESaDfceBne66WlYw_AzdVtJD9zIHeyEjL__-Qeg/exec';
const CUOTA = 100;
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const $ = s => document.querySelector(s);
const eur = n => n.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
const mesTxt = m => { const [a,b] = m.split('-'); const t = MESES[b-1]; return t[0].toUpperCase() + t.slice(1) + ' ' + a; };
const fechaTxt = f => f.split('-').reverse().join('/');
const hoy = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let pagos = [], editando = null, confirmando = false;
try { pagos = JSON.parse(localStorage.getItem('pagos') || '[]'); } catch (e) {}

// Identificador anónimo de este dispositivo (desde una página web no se puede conocer la IP).
// Si el navegador no permite guardarlo, se usa uno temporal y los avisos se repiten en cada apertura.
let miId;
try {
  miId = localStorage.getItem('dispositivo');
  if (!miId) { miId = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); localStorage.setItem('dispositivo', miId); }
} catch (e) { miId = 'tmp' + Math.random().toString(36).slice(2, 10); }
let vistos = [], idsAviso = [], ultimoPend = 0;
try { vistos = JSON.parse(localStorage.getItem('vistos') || '[]'); } catch (e) {}
function marcarVistos(ids) {
  vistos = [...new Set([...vistos, ...ids])].slice(-200);
  try { localStorage.setItem('vistos', JSON.stringify(vistos)); } catch (e) {}
}
const mesNombre = m => { const [a, b] = m.split('-'); return MESES[b-1] + (a !== hoy().slice(0,4) ? ' de ' + a : ''); };

// Vista previa de los avisos: añade ?aviso=pendiente o ?aviso=pagado a la dirección (no guarda nada).
const demo = ['pendiente', 'pagado'].includes(new URLSearchParams(location.search).get('aviso')) ? new URLSearchParams(location.search).get('aviso') : null;
const ICONO = {
  mal: '<svg viewBox="0 0 64 64" width="76" height="76" aria-hidden="true"><path d="M32 6 60 56H4Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M32 25v15" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="48" r="3" fill="#fff"/></svg>',
  ok: '<svg viewBox="0 0 64 64" width="76" height="76" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="none" stroke="#fff" stroke-width="4"/><path class="chk" d="M19 33l9 9 17-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
const unir = a => a.length > 1 ? a.slice(0, -1).join(', ') + ' y ' + a[a.length - 1] : a[0];
const cap = t => t[0].toUpperCase() + t.slice(1);

// Dibuja el aviso: pend = mes pendiente (o null), pagados = meses pagados, exito = acaba de pagarse aquí.
function pintarAviso(pend, pagados, exito) {
  const d = $('#dlgAviso'), tipo = pend ? 'mal' : 'ok', lista = pagados.map(mesNombre);
  const prueba = demo ? '<p class="av-extra prueba">Vista previa: no se guarda nada.</p>' : '';
  const conf = tipo === 'ok' && !matchMedia('(prefers-reduced-motion: reduce)').matches
    ? Array.from({length: 18}, (_, i) => `<i class="av-conf" style="left:${(i*37+11)%100}%;background:${['#ffc933','#fff','#8be0b0','#ffd86b'][i%4]};animation-delay:${(i%6)*0.12}s"></i>`).join('') : '';
  let cab, sub, cuerpo;
  if (pend) {
    cab = cap(mesNombre(pend)); sub = 'pendiente de pago';
    cuerpo = `${prueba}<p class="av-txt">El mes de ${mesNombre(pend)} aún está pendiente de pago.</p>`
      + (lista.length ? `<p class="av-extra">✓ El mes de ${unir(lista)} ha sido pagado.</p>` : '')
      + `<label for="avClave">Contraseña</label><input id="avClave" type="password" inputmode="numeric" autocomplete="off">`
      + `<div class="msg" id="avMsg"></div><button class="av-btn mal" id="avPagar">Registrar pago de ${eur(CUOTA)} ahora</button>`
      + `<div class="av-links"><button id="avOtro">Otro importe o nota</button><button id="avCerrar">Más tarde</button></div>`;
  } else {
    cab = cap(unir(lista)); sub = exito ? '¡pago registrado!' : 'pagado';
    cuerpo = `${prueba}<p class="av-txt">El mes de ${unir(lista)} ha sido pagado.</p><button class="av-btn ok" id="avCerrar">Entendido</button>`;
  }
  d.innerHTML = `<div class="av-cab ${tipo}">${conf}${ICONO[tipo]}<div class="av-mes">${cab}</div><div class="av-sub">${sub}</div></div><div class="av-cuerpo">${cuerpo}</div>`;
  $('#avCerrar').onclick = () => d.close();
  if (!pend) return;
  $('#avOtro').onclick = () => { d.close(); abrir(null); };
  const pagar = async () => {
    if (demo) { pintarAviso(null, [pend], true); return; }
    const msgEl = $('#avMsg'), clv = $('#avClave').value, b = $('#avPagar');
    if (!clv) { msgEl.className = 'msg err'; msgEl.textContent = 'Escribe la contraseña.'; return; }
    b.disabled = true;
    const ok = await enviar({action: 'add', clave: clv, mes: pend, fecha: hoy(), importe: CUOTA, nota: '', dispositivo: miId}, msgEl);
    if (ok) pintarAviso(null, [pend], true); else b.disabled = false;
  };
  $('#avPagar').onclick = pagar;
  $('#avClave').onkeydown = e => { if (e.key === 'Enter') pagar(); };
}

function avisos() {
  if (demo || !pagos.length || $('#dlgAviso').open || $('#dlg').open || $('#dlgClave').open) return;
  const clave = hoy().slice(0,7);
  const pagado = pagos.filter(p => p.mes === clave).reduce((s,p) => s + p.importe, 0) >= CUOTA;
  // 1) Mes en curso sin pagar: se avisa en cada apertura (como mucho cada 30 min) hasta que se pague.
  const pend = !pagado && Date.now() - ultimoPend > 30*60e3 ? clave : null;
  // 2) Pagos registrados desde otro dispositivo que este aún no ha visto (solo los del mes en curso).
  const nuevos = pagos.filter(p => p.por && p.por !== miId && !vistos.includes(p.id) && (p.mes === clave || (p.creado || '').slice(0,7) === clave))
    .sort((a,b) => a.mes.localeCompare(b.mes));
  const meses = [...new Set(nuevos.map(p => p.mes))];
  if (!pend && !meses.length) return;
  if (pend) ultimoPend = Date.now();
  idsAviso = nuevos.map(p => p.id);
  pintarAviso(pend, meses, false);
  $('#dlgAviso').showModal();
}
$('#dlgAviso').addEventListener('close', () => marcarVistos(idsAviso));

function estado(t, err) { const e = $('#estado'); e.textContent = t; e.className = err ? 'err' : ''; }
function guardarCopia() { try { localStorage.setItem('pagos', JSON.stringify(pagos)); } catch (e) {} }

function render() {
  const orden = [...pagos].sort((a,b) => b.mes.localeCompare(a.mes) || b.fecha.localeCompare(a.fecha));
  const total = pagos.reduce((s,p) => s + p.importe, 0);
  $('#total').textContent = eur(total);
  $('#cuenta').textContent = pagos.length;
  $('#ultimo').textContent = orden.length ? fechaTxt([...pagos].sort((a,b) => b.fecha.localeCompare(a.fecha))[0].fecha) : '–';

  const clave = hoy().slice(0,7);
  const pagado = pagos.filter(p => p.mes === clave).reduce((s,p) => s + p.importe, 0) >= CUOTA;
  const chip = $('#chip'); chip.hidden = false;
  chip.className = 'chip ' + (pagado ? 'ok' : 'mal');
  chip.textContent = mesTxt(clave) + ': ' + (pagado ? 'pagado' : 'pendiente de pago');

  if (!orden.length) { $('#lista').innerHTML = '<div class="vacio">Aún no hay pagos. Pulsa «Registrar pago» para añadir el primero.</div>'; return; }
  let html = '', anio = '';
  for (const p of orden) {
    const a = p.mes.slice(0,4);
    if (a !== anio) { if (anio) html += '</div>'; anio = a; html += `<h2>${a}</h2><div>`; }
    html += `<button class="fila" data-id="${p.id}"><span><b>${mesTxt(p.mes)}</b><small>Pagado el ${fechaTxt(p.fecha)}</small>${p.nota ? `<small class="nota">${esc(p.nota)}</small>` : ''}</span><span class="der num"><b>${eur(p.importe)}</b></span></button>`;
  }
  $('#lista').innerHTML = html + '</div>';
}

async function sincronizar(avisar) {
  if (API_URL.startsWith('PEGA')) { estado('Falta configurar la URL de Apps Script', true); return; }
  try {
    const r = await fetch(API_URL + '?t=' + Date.now());
    const d = await r.json();
    if (!d.ok) throw new Error();
    pagos = d.pagos; guardarCopia(); render();
    estado('Sincronizado a las ' + new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}));
  } catch (e) { estado('Sin conexión · se muestra la última copia', true); }
  if (avisar) avisos();
}

async function enviar(cuerpo, msgEl) {
  msgEl.className = 'msg'; msgEl.textContent = 'Guardando…';
  try {
    const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(cuerpo)});
    const d = await r.json();
    if (!d.ok) { msgEl.className = 'msg err'; msgEl.textContent = d.error; return false; }
    if (d.pagos) { pagos = d.pagos; guardarCopia(); render(); }
    estado('Guardado y sincronizado');
    return true;
  } catch (e) { msgEl.className = 'msg err'; msgEl.textContent = 'No se pudo conectar. Inténtalo de nuevo.'; return false; }
}

function abrir(p) {
  editando = p ? p.id : null; confirmando = false;
  $('#dlgTitulo').textContent = p ? 'Editar pago' : 'Registrar pago';
  $('#mes').value = p ? p.mes : hoy().slice(0,7);
  $('#fecha').value = p ? p.fecha : hoy();
  $('#importe').value = p ? p.importe : CUOTA;
  $('#nota').value = p ? p.nota : '';
  $('#clave').value = ''; $('#msg').textContent = '';
  const b = $('#btnEliminar'); b.hidden = !p; b.textContent = 'Eliminar';
  $('#dlg').showModal();
}

$('#btnNuevo').onclick = () => abrir(null);
$('#lista').onclick = e => { const f = e.target.closest('.fila'); if (f) abrir(pagos.find(p => p.id === f.dataset.id)); };
$('#btnCancelar').onclick = () => $('#dlg').close();
$('#frm').onsubmit = async e => {
  e.preventDefault();
  const ok = await enviar({action: editando ? 'update' : 'add', id: editando, clave: $('#clave').value,
    mes: $('#mes').value, fecha: $('#fecha').value, importe: parseFloat($('#importe').value), nota: $('#nota').value.trim(), dispositivo: miId}, $('#msg'));
  if (ok) $('#dlg').close();
};
$('#btnEliminar').onclick = async () => {
  if (!confirmando) { confirmando = true; $('#btnEliminar').textContent = 'Confirmar eliminación'; return; }
  const ok = await enviar({action:'delete', id:editando, clave:$('#clave').value}, $('#msg'));
  if (ok) $('#dlg').close();
};

$('#btnClave').onclick = () => { $('#frmClave').reset(); $('#msgClave').textContent = ''; $('#dlgClave').showModal(); };
$('#cancelarClave').onclick = () => $('#dlgClave').close();
$('#frmClave').onsubmit = async e => {
  e.preventDefault();
  const ok = await enviar({action:'cambiarClave', clave:$('#claveActual').value, nueva:$('#claveNueva').value}, $('#msgClave'));
  if (ok) { $('#dlgClave').close(); estado('Contraseña cambiada'); }
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
const instalada = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
let invitacion = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); invitacion = e; $('#instalar').hidden = false; });
$('#btnInstalar').onclick = async () => { if (!invitacion) return; invitacion.prompt(); await invitacion.userChoice; invitacion = null; $('#instalar').hidden = true; };
addEventListener('appinstalled', () => { $('#instalar').hidden = true; });
if (!instalada && /iphone|ipad|ipod/i.test(navigator.userAgent)) $('#ayudaIos').hidden = false;

render(); sincronizar(true);
if (demo) { const c = hoy().slice(0,7); pintarAviso(demo === 'pagado' ? null : c, demo === 'pagado' ? [c] : [], false); $('#dlgAviso').showModal(); }
setInterval(() => { if (!document.hidden && !$('#dlg').open && !$('#dlgClave').open) sincronizar(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sincronizar(true); });
</script>
</body>
</html>
